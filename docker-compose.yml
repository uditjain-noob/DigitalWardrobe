# Postgres + object storage for dev and test. This is the file production
# runs too (infrastructure doc §3) — MinIO stands in locally for Cloudflare
# R2; Caddy is added in front for TLS when this is deployed. Nothing here is
# dev-only in a way production would need a different topology to replace:
# `minio-init` is a one-shot bootstrap job (it creates the bucket and exits),
# not a standing service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wardrobe
      MINIO_ROOT_PASSWORD: wardrobe12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 wardrobe wardrobe12345 &&
      (mc mb local/wardrobe || true)
      "

volumes:
  postgres-data:
  minio-data:
